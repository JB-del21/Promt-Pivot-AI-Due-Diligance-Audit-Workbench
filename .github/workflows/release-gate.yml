name: v7.1 Release Gate CI
on:
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      DATABASE_URL: postgres://pivot_test:pivot_test@127.0.0.1:5432/prompt_pivot_test
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: pivot_test
          POSTGRES_PASSWORD: pivot_test
          POSTGRES_DB: prompt_pivot_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U pivot_test -d prompt_pivot_test"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      # Temporary compatibility mode. The committed bun.lock belongs to an
      # older dependency graph and cannot safely be treated as authoritative.
      # A future gate must commit and enforce an npm package-lock.json.
      - name: Install dependencies (no install scripts)
        run: npm install --ignore-scripts --no-audit --no-fund --no-package-lock
      - name: TypeScript
        run: npm run lint
      - name: Unit and security regressions
        run: npm test
      - name: Vite production bundle
        run: npm run build
